<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Engine | Groq Llama 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="bg-[#0f0f12] text-white antialiased">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar kiri -->
      <aside
        class="w-72 bg-[#1a1a24] border-r border-gray-800 flex flex-col shrink-0">
        <div class="p-4 border-b border-gray-800">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <img
              src="{{ url_for('static', filename='depositphotos_117993120-stock-illustration-letter-se-sc-logo-concrpt.jpg') }}"
              alt="Bot Logo"
              class="w-7 h-7 rounded-full" />
            <span>Chat Engine</span>
            <span
              class="text-xs bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded-full"
              >Engine 2.5</span
            >
          </h2>
        </div>
        <div class="p-3">
          <button
            id="newChatBtn"
            class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 transition-colors py-2.5 rounded-lg font-medium text-sm">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New Chat
          </button>
        </div>
        <div class="flex-1 overflow-y-auto px-2 pb-4">
          <div
            class="text-xs uppercase tracking-wider text-gray-500 px-3 pt-4 pb-2">
            Riwayat Chat
          </div>
          <div id="chatList" class="space-y-1"></div>
        </div>
        <div
          class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center">
          Powered by Engine 2.5
        </div>
      </aside>

      <!-- Area chat utama -->
      <main class="flex-1 flex flex-col bg-[#0f0f12]">
        <div
          class="border-b border-gray-800 px-6 py-3 flex items-center justify-between bg-[#12121a]">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
            <span class="text-sm font-medium">Online · Cloud Engine</span>
          </div>
          <div class="text-sm text-gray-400">
            Model: <span class="text-blue-400">Engine 2.5</span>
          </div>
        </div>
        <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4">
          <div
            class="flex flex-col items-center justify-center h-full text-center text-gray-500">
            <div class="text-5xl mb-4">💬</div>
            <p class="text-lg font-medium">Mulai percakapan baru</p>
            <p class="text-sm">Klik "New Chat" atau kirim pesan di bawah</p>
          </div>
        </div>
        <div class="border-t border-gray-800 p-4 bg-[#12121a]">
          <div class="flex gap-3 items-center">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Tanyakan apa saja..."
              class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none"></textarea>
            <button
              id="sendBtn"
              class="bg-blue-600 hover:bg-blue-700 p-2 rounded-xl transition-colors">
              <img
                src="{{ url_for('static', filename='arrow_send.png') }}"
                alt="Send"
                class="w-5 h-5" />
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-2 text-center">
            Gratis · Konteks penuh · Tersimpan di browser Anda
          </p>
        </div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
